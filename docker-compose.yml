version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite DB and uploaded audio files to host workspace so data survives restarts
      - ./backend/storage/zeusonic.db:/app/backend/storage/zeusonic.db
      - ./backend/storage/audio_uploads:/app/backend/storage/audio_uploads
      - ./backend/.demo_api_key:/app/backend/.demo_api_key
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
